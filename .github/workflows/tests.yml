name: Validación ligera
on: [push, pull_request]
jobs:
  timing-and-editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -p test_editor.py -v
      - run: python -m unittest discover -s tests -p test_motion.py -v
      # BAT, instalador, ASR offline e iPhone se verifican localmente en Windows.
  remotion-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: remotion
      - run: npm run typecheck
        working-directory: remotion
