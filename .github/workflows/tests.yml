name: Validación ligera
on: [push, pull_request]
jobs:
  timing-and-editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -p test_editor.py -v
      - run: python -m unittest discover -s tests -p test_v2.py -v
      - run: python -m unittest discover -s tests -p test_motion.py -v
      - run: python -m unittest discover -s tests -p test_studio.py -v
      # BAT, instalador, ASR offline e iPhone se verifican localmente en Windows.
  remotion-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: remotion
      - run: npm run typecheck
        working-directory: remotion
  studio-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: studio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run test:postgres
        working-directory: web
        env:
          DATABASE_URL: postgres://studio:ci-only-password@localhost:5432/studio_test
      - run: npm run build
        working-directory: web
